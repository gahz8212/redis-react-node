version: '3.8'

services:
  # 1. Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  # 2. Frontend (Vite)
  frontend:
    build: ./frontend
    container_name: vite_frontend
    expose:
      - "5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - app-network

  # 3. Backend (Node.js + Sequelize + Redis Session)
  backend:
    build: ./backend
    container_name: node_backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # [내 컴퓨터의 실제 폴더 경로] : [컨테이너 내부 경로]
      - ./backend/uploads:/app/uploads
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_NAME=trip-db
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379
      - REDIS_PORT=6379
      - COOKIE_SECRET=camino
      - PORT=5000
    depends_on:
      - db
      - redis
    networks:
      - app-network

  # 4. Database (MySQL) - 외부 3307 사용
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: trip-db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3309:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  # 5. Cache & Session Store (Redis) - 누락되었던 부분
  redis:
    image: redis:alpine
    container_name: redis_session
    restart: always
    expose:
      - "6379"
    ports:
    - "6379:6379"
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge